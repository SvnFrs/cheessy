[project]
name = "cheessy-lab"
version = "0.1.0"
description = "Local chess sparring and game-review lab"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.1",
    "rich>=13.7",
]

[project.scripts]
cheessy = "cheessy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheessy"]
